name: Package Chrome extension

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Build Chrome Web Store package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_URL: ${{ vars.PLOTTWIST_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production API URL
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https:// ]]; then
            echo "Repository variable PLOTTWIST_API_URL must be an HTTPS URL."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build -w @plottwist/extension
      - name: Create store archive
        working-directory: apps/extension/dist
        run: zip -r ../plottwist-chrome.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: plottwist-chrome
          path: apps/extension/plottwist-chrome.zip
          if-no-files-found: error
      - name: Attach archive to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" apps/extension/plottwist-chrome.zip --generate-notes
